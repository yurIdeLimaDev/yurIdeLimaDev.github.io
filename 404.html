<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f7f4" />
    <title>Página não encontrada | Yuri de Lima</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        color: #17211c;
        background: #f5f7f4;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main { width: min(100%, 720px); border-top: 1px solid #2e654c; padding-top: 28px; }
      p:first-child { color: #2e654c; font-family: monospace; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 22px 0; font-size: clamp(3rem, 12vw, 7rem); line-height: .95; letter-spacing: -.06em; }
      p { color: #a8b6ae; }
      a { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 999px; color: #ffffff; background: #2e654c; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #537467; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>Erro 404</p>
      <h1>Este caminho não existe.</h1>
      <p>O endereço pode ter mudado ou ter sido digitado incorretamente.</p>
      <a href="/">Voltar ao portfólio</a>
    </main>
  </body>
</html>
